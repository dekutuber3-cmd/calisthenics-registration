form,.done{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:28px 22px}
fieldset{border:0;padding:0;margin:0 0 26px}
legend,label.l{font-weight:600;display:block;margin-bottom:6px;padding:0}
.hint{color:var(--mute);font-size:.9rem;margin:0 0 8px}
.row{display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:600px){.row{grid-template-columns:1fr 1fr}}
.f{margin-bottom:22px}
input[type=text],input[type=email],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:11px 12px}
textarea{min-height:110px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,.chip input:focus-visible+span,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-block;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--bg);font-weight:500}
.chip input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.lv .chip span{border-radius:6px;padding:10px 16px}
.err{color:var(--err);font-size:.88rem;margin:6px 0 0;min-height:1em}
.bad{border-color:var(--err)!important}
button.go{font:900 1.2rem Archivo,"Arial Black",sans-serif;letter-spacing:.03em;text-transform:uppercase;background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:15px 28px;cursor:pointer;width:100%;box-shadow:0 0 28px rgba(57,255,20,.35)}
button.go:hover{filter:brightness(1.1)}
.done h2{font:900 2rem/1 Archivo,"Arial Black",sans-serif;text-transform:uppercase;color:var(--acc);margin:0 0 12px}
.done dl{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}
.done dt{color:var(--mute)}.done dd{margin:0;word-break:break-word}
[hidden]{display:none!important}
@media(prefers-reduced-motion:no-preference){.done{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.97);opacity:0}}}
</style>

      <div class="f"><label class="l" for="email">Email</label><input id="email" type="email" autocomplete="email"><p class="err" data-for="email"></p></div>
      <div class="f"><label class="l" for="state">State</label>
        <select id="state"><option value="">Select your state</option></select><p class="err" data-for="state"></p></div>
    </div>

    <fieldset class="lv" id="level"><legend>Your level</legend>
      <div class="chips">
        <label class="chip"><input type="radio" name="level" value="Beginner"><span>Beginner</span></label>
        <label class="chip"><input type="radio" name="level" value="Intermediate"><span>Intermediate</span></label>
        <label class="chip"><input type="radio" name="level" value="Advanced"><span>Advanced</span></label>
        <label class="chip"><input type="radio" name="level" value="Elite"><span>Elite</span></label>
      </div><p class="err" data-for="level"></p>
    </fieldset>

    <fieldset id="skills"><legend>Skills you can perform</legend>
      <p class="hint">Tick every skill you can do.</p>
      <div class="chips" id="skillChips"></div>
      <div class="f" style="margin-top:12px"><input id="otherSkills" type="text" placeholder="Other skills (comma separated)"></div>
      <p class="err" data-for="skills"></p>
    </fieldset>

    <div class="f"><label class="l" for="combos">Skill combos you can do</label>
      <p class="hint">Write each combo on its own line, e.g. Muscle-up into dip into handstand.</p>
      <textarea id="combos"></textarea><p class="err" data-for="combos"></p></div>

    <button class="go" type="submit">Register for Battle of Cali</button>
  </form>

  <section class="done" id="done" hidden aria-live="polite">
    <h2>You're in the battle</h2>
    <p id="doneMsg"></p>
    <dl id="summary"></dl>
  </section>
</main>

<script>
(function(){
  var states=["Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Andaman and Nicobar Islands","Chandigarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Jammu and Kashmir","Ladakh","Lakshadweep","Puducherry"];
  var skills=["Pull-up","Dip","Muscle-up","Handstand","Handstand push-up","L-sit","V-sit","Front lever","Back lever","Planche","Human flag","Dragon flag","Pistol squat","360 pull","Freestyle swings"];
  var $=function(id){return document.getElementById(id)};
  var sel=$("state");
  states.forEach(function(s){var o=document.createElement("option");o.value=o.textContent=s;sel.appendChild(o)});
  var box=$("skillChips");
  skills.forEach(function(s){var l=document.createElement("label");l.className="chip";l.innerHTML='<input type="checkbox" name="skill"><span></span>';l.querySelector("input").value=s;l.querySelector("span").textContent=s;box.appendChild(l)});
  function setErr(k,m){var e=document.querySelector('.err[data-for="'+k+'"]');if(e)e.textContent=m||"";var f=$(k);if(f&&f.classList)f.classList.toggle("bad",!!m)}
  function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML}
  $("reg").addEventListener("submit",function(ev){
    ev.preventDefault();
    var v={name:$("name").value.trim(),yt:$("yt").value.trim(),email:$("email").value.trim(),state:sel.value,combos:$("combos").value.trim()};
    var lv=document.querySelector('input[name="level"]:checked');
    var picked=[].map.call(document.querySelectorAll('input[name="skill"]:checked'),function(i){return i.value});
    var other=$("otherSkills").value.split(",").map(function(s){return s.trim()}).filter(Boolean);
    var all=picked.concat(other);
    var bad=null;
    function chk(k,cond,msg){if(cond){setErr(k,"");}else{setErr(k,msg);if(!bad)bad=k}}
    chk("name",v.name.length>1,"Enter your full name.");
    chk("yt",v.yt.length>0,"Enter your YouTube channel name.");
    chk("email",/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email),"Enter a valid email, like name@example.com.");
    chk("state",!!v.state,"Choose your state.");
    chk("level",!!lv,"Choose your level.");
    chk("skills",all.length>0,"Pick at least one skill.");
    chk("combos",v.combos.length>2,"Write at least one skill combo.");
    if(bad){var t=$(bad);if(t&&t.focus)t.focus();else t.scrollIntoView({block:"center"});return}
    var rec={name:v.name,youtube:v.yt,email:v.email,state:v.state,level:lv.value,skills:all,combos:v.combos,at:new Date().toISOString()};
    try{var list=JSON.parse(localStorage.getItem("battle-of-cali-regs")||"[]");list.push(rec);localStorage.setItem("battle-of-cali-regs",JSON.stringify(list))}catch(e){}
    $("doneMsg").textContent="Thanks, "+v.name+". We'll email "+v.email+" with the next steps.";
    $("summary").innerHTML=[["Channel",rec.youtube],["State",rec.state],["Level",rec.level],["Skills",all.join(", ")],["Combos",v.combos.replace(/\n+/g,"; ")]].map(function(r){return "<dt>"+r[0]+"</dt><dd>"+esc(r[1])+"</dd>"}).join("");
    $("reg").hidden=true;$("done").hidden=false;$("done").scrollIntoView({block:"start"});
  });
})();
</script>
</body>
</html>
